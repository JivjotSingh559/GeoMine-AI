<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="120" fill="none">
  <defs>
    <!-- Warm Copper & Geological Palette -->
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9557"/>
      <stop offset="100%" stop-color="#E98245"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D6C1"/>
      <stop offset="100%" stop-color="#B9AAA0"/>
    </linearGradient>
    <linearGradient id="crystalShine" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F5EEE7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E98245" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="copperGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Icon Container -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield / Hexagonal Crystal -->
    <polygon points="50,4 92,28 92,72 50,96 8,72 8,28" 
             fill="#211D19" stroke="#493A30" stroke-width="2"/>
    <polygon points="50,8 88,30 88,70 50,92 12,70 12,30" 
             fill="#29231F" stroke="url(#copperGrad)" stroke-width="1.5" stroke-dasharray="160 8" />
    
    <!-- Crystalline Geological Facets -->
    <polygon points="50,8 50,50 12,30" fill="#332922" opacity="0.85"/>
    <polygon points="50,8 88,30 50,50" fill="#3D3028" opacity="0.9"/>
    <polygon points="88,30 88,70 50,50" fill="#2E241E" opacity="0.75"/>
    <polygon points="50,50 88,70 50,92" fill="#1E1915" opacity="0.9"/>
    <polygon points="12,70 50,50 50,92" fill="#251E19" opacity="0.8"/>
    <polygon points="12,30 50,50 12,70" fill="#382A22" opacity="0.6"/>

    <!-- Inner Core Strata / Facet Highlights -->
    <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" 
             fill="none" stroke="#E98245" stroke-width="1.2" opacity="0.85"/>
    <line x1="50" y1="22" x2="50" y2="78" stroke="#E98245" stroke-width="1.2" opacity="0.75"/>
    <line x1="26" y1="36" x2="74" y2="64" stroke="#B96D43" stroke-width="0.8" opacity="0.6"/>
    <line x1="26" y1="64" x2="74" y2="36" stroke="#B96D43" stroke-width="0.8" opacity="0.6"/>

    <!-- Core Element Glowing Node -->
    <circle cx="50" cy="50" r="4.5" fill="#E98245" filter="url(#copperGlow)"/>
    <circle cx="50" cy="50" r="2" fill="#F5EEE7"/>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <!-- Main Title -->
    <text x="0" y="44" font-family="'Syne', 'Barlow Condensed', 'Segoe UI', sans-serif" font-size="38" font-weight="800" fill="#F5EEE7" letter-spacing="1.5">
      GEOMINE<tspan fill="#E98245"> AI</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="2" y="66" font-family="'DM Mono', 'Courier New', monospace" font-size="10.5" font-weight="500" fill="#B9AAA0" letter-spacing="2.5">
      MINERAL EXPLORATION INTELLIGENCE
    </text>

    <!-- Platform Version Tag -->
    <rect x="2" y="76" width="115" height="18" rx="4" fill="#332922" stroke="#493A30" stroke-width="1"/>
    <circle cx="11" cy="85" r="3" fill="#78B89A"/>
    <text x="20" y="88.5" font-family="'DM Mono', monospace" font-size="8.5" font-weight="500" fill="#E8D6C1" letter-spacing="1">
      4-TIER PORTAL v2.0
    </text>
  </g>
</svg>
