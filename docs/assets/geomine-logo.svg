<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="120" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42e5d1"/>
      <stop offset="100%" stop-color="#1aa898"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7f36b"/>
      <stop offset="100%" stop-color="#42e5d1"/>
    </linearGradient>
    <linearGradient id="crystalShine" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#42e5d1" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Icon Container -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield / Hexagonal Crystal -->
    <polygon points="50,4 92,28 92,72 50,96 8,72 8,28" 
             fill="#0c151d" stroke="#243542" stroke-width="2"/>
    <polygon points="50,8 88,30 88,70 50,92 12,70 12,30" 
             fill="#101922" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-dasharray="160 8" />
    
    <!-- Crystalline Geological Facets -->
    <polygon points="50,8 50,50 12,30" fill="#142634" opacity="0.8"/>
    <polygon points="50,8 88,30 50,50" fill="#193345" opacity="0.9"/>
    <polygon points="88,30 88,70 50,50" fill="#132a39" opacity="0.7"/>
    <polygon points="50,50 88,70 50,92" fill="#0d1f2b" opacity="0.9"/>
    <polygon points="12,70 50,50 50,92" fill="#11222e" opacity="0.8"/>
    <polygon points="12,30 50,50 12,70" fill="#183647" opacity="0.6"/>

    <!-- Inner Core Strata / Facet Highlights -->
    <polygon points="50,22 74,36 74,64 50,78 26,64 26,36" 
             fill="none" stroke="#42e5d1" stroke-width="1.2" opacity="0.8"/>
    <line x1="50" y1="22" x2="50" y2="78" stroke="#42e5d1" stroke-width="1.2" opacity="0.7"/>
    <line x1="26" y1="36" x2="74" y2="64" stroke="#42e5d1" stroke-width="0.8" opacity="0.5"/>
    <line x1="26" y1="64" x2="74" y2="36" stroke="#42e5d1" stroke-width="0.8" opacity="0.5"/>

    <!-- Core Element Glowing Node -->
    <circle cx="50" cy="50" r="4.5" fill="#b7f36b" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="2" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <g transform="translate(130, 20)">
    <!-- Wordmark GEOMINE -->
    <text x="0" y="44" font-family="'Barlow Condensed', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#e7f0f4" letter-spacing="3.5">
      GEOMINE<tspan fill="#42e5d1"> AI</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="2" y="68" font-family="'DM Mono', 'Consolas', monospace" font-size="11.5" font-weight="500" fill="#8297a5" letter-spacing="2.2">
      MINERAL EXPLORATION INTELLIGENCE
    </text>

    <!-- Tag Indicator -->
    <rect x="2" y="80" width="7" height="7" rx="1" fill="#b7f36b"/>
    <text x="16" y="87" font-family="'DM Mono', 'Consolas', monospace" font-size="9" font-weight="500" fill="#b7f36b" letter-spacing="1">
      SPATIAL ASSAY SYSTEMS &amp; GEOCHEMICAL REPOSITORY
    </text>
  </g>
</svg>
