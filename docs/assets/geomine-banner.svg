<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" fill="none">
  <defs>
    <!-- Background Gradient: Warm Earth/Copper Palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171513"/>
      <stop offset="50%" stop-color="#211D19"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="copperBright" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9557"/>
      <stop offset="100%" stop-color="#E98245"/>
    </linearGradient>
    <linearGradient id="mutedCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B96D43"/>
      <stop offset="100%" stop-color="#733F23"/>
    </linearGradient>
    <linearGradient id="warmSand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8D6C1"/>
      <stop offset="100%" stop-color="#B9AAA0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#332922" stroke-width="0.8" opacity="0.6"/>
      <circle cx="40" cy="40" r="1.2" fill="#493A30" opacity="0.7"/>
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Topographic Contour Lines (Geological Elevation Simulation in Warm Sand / Terracotta) -->
  <g opacity="0.22" stroke="#E98245" stroke-width="1.2" fill="none">
    <path d="M -50 300 C 180 340, 320 240, 520 270 C 720 300, 850 210, 1050 240 C 1150 255, 1220 220, 1260 230" />
    <path d="M -50 260 C 150 290, 360 200, 560 230 C 760 260, 890 170, 1080 200 C 1170 215, 1220 190, 1260 195" />
    <path d="M -50 340 C 200 380, 280 280, 480 310 C 680 340, 820 250, 1020 280 C 1120 295, 1200 260, 1260 270" stroke="#B96D43"/>
    <path d="M -50 380 C 220 420, 310 320, 510 350 C 710 380, 860 290, 1060 320 C 1160 335, 1210 300, 1260 310" stroke="#493A30"/>
    <path d="M 680 -40 C 760 80, 920 40, 1050 100 C 1150 145, 1220 120, 1260 130" stroke="#E8D6C1" opacity="0.3"/>
  </g>

  <!-- Subterranean Borehole / Depth Crosshairs (Right Side Graphic) -->
  <g transform="translate(840, 50)" opacity="0.95">
    <!-- Depth Strata Box -->
    <rect x="0" y="0" width="310" height="320" rx="16" fill="#29231F" stroke="#493A30" stroke-width="1.5"/>
    <rect x="15" y="15" width="280" height="55" rx="8" fill="#332922" stroke="#493A30"/>
    <rect x="15" y="78" width="280" height="55" rx="8" fill="#3D2E24" stroke="#E98245" stroke-width="1.2"/>
    <rect x="15" y="141" width="280" height="55" rx="8" fill="#2B221D" stroke="#493A30"/>
    <rect x="15" y="204" width="280" height="55" rx="8" fill="#211B17" stroke="#493A30"/>
    <rect x="15" y="267" width="280" height="38" rx="6" fill="#1A1512" stroke="#493A30"/>

    <!-- Strata labels -->
    <text x="30" y="47" font-family="'DM Mono', monospace" font-size="11" fill="#E8D6C1" font-weight="600">01. LATERITIC DURICRUST</text>
    <text x="240" y="47" font-family="'DM Mono', monospace" font-size="10" fill="#B9AAA0">0–3.5m</text>

    <text x="30" y="110" font-family="'DM Mono', monospace" font-size="11" fill="#FF9557" font-weight="700">02. BAUXITIC / ORE ZONE</text>
    <text x="235" y="110" font-family="'DM Mono', monospace" font-size="10" fill="#FF9557">3.5–12m</text>

    <text x="30" y="173" font-family="'DM Mono', monospace" font-size="11" fill="#B9AAA0" font-weight="500">03. SAPROLITIC TRANSITION</text>
    <text x="235" y="173" font-family="'DM Mono', monospace" font-size="10" fill="#87786E">12–22m</text>

    <text x="30" y="236" font-family="'DM Mono', monospace" font-size="11" fill="#87786E" font-weight="500">04. CRYSTALLINE BASEMENT</text>
    <text x="240" y="236" font-family="'DM Mono', monospace" font-size="10" fill="#87786E">&gt;22m</text>

    <text x="30" y="291" font-family="'DM Mono', monospace" font-size="9.5" fill="#78B89A">✓ AUDITED BOREHOLE STRATA</text>
    <circle cx="270" cy="286" r="3.5" fill="#78B89A"/>
  </g>

  <!-- Left Content: Title, Branding, Chips -->
  <g transform="translate(60, 65)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#29231F" stroke="#493A30" stroke-width="1"/>
    <circle cx="14" cy="14" r="4.5" fill="#78B89A" filter="url(#badgeGlow)"/>
    <text x="28" y="18" font-family="'DM Mono', monospace" font-size="10" font-weight="500" fill="#F5EEE7" letter-spacing="1">
      MINERAL EXPLORATION INTELLIGENCE
    </text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Syne', sans-serif" font-size="54" font-weight="800" fill="#F5EEE7" letter-spacing="0.5">
      GEOMINE <tspan fill="url(#copperBright)">AI</tspan>
    </text>

    <!-- Subtitle -->
    <text x="2" y="125" font-family="'DM Sans', sans-serif" font-size="17" fill="#B9AAA0" font-weight="400">
      AI-Powered Subsurface Geoscience &amp; Exploration Analytics Portal
    </text>
    <text x="2" y="152" font-family="'DM Sans', sans-serif" font-size="13" fill="#87786E" font-weight="400">
      Unifying 32,562 Historical Records · 18 Exploration Sites · Leaflet Geospatial Mapping
    </text>

    <!-- Core 4 Pillars / Navigation Badges -->
    <g transform="translate(0, 180)">
      <!-- Pillar 1: Dashboard -->
      <g transform="translate(0, 0)">
        <rect width="150" height="42" rx="8" fill="#29231F" stroke="#493A30" stroke-width="1.2"/>
        <circle cx="18" cy="21" r="5" fill="#E98245"/>
        <text x="32" y="25" font-family="'Syne', sans-serif" font-size="12" font-weight="700" fill="#F5EEE7">01. DASHBOARD</text>
      </g>
      <!-- Pillar 2: Explore Sites -->
      <g transform="translate(162, 0)">
        <rect width="165" height="42" rx="8" fill="#29231F" stroke="#E98245" stroke-width="1.5"/>
        <circle cx="18" cy="21" r="5" fill="#FF9557"/>
        <text x="32" y="25" font-family="'Syne', sans-serif" font-size="12" font-weight="700" fill="#FF9557">02. EXPLORE SITES</text>
      </g>
      <!-- Pillar 3: Analytics -->
      <g transform="translate(339, 0)">
        <rect width="150" height="42" rx="8" fill="#29231F" stroke="#493A30" stroke-width="1.2"/>
        <circle cx="18" cy="21" r="5" fill="#78B89A"/>
        <text x="32" y="25" font-family="'Syne', sans-serif" font-size="12" font-weight="700" fill="#F5EEE7">03. ANALYTICS</text>
      </g>
      <!-- Pillar 4: Reports -->
      <g transform="translate(501, 0)">
        <rect width="140" height="42" rx="8" fill="#29231F" stroke="#493A30" stroke-width="1.2"/>
        <circle cx="18" cy="21" r="5" fill="#E8D6C1"/>
        <text x="32" y="25" font-family="'Syne', sans-serif" font-size="12" font-weight="700" fill="#F5EEE7">04. REPORTS</text>
      </g>
    </g>

    <!-- Bottom Metadata Metric Chips -->
    <g transform="translate(0, 245)">
      <rect x="0" y="0" width="135" height="48" rx="8" fill="#211D19" stroke="#493A30"/>
      <text x="14" y="24" font-family="'Syne', sans-serif" font-size="18" font-weight="700" fill="#E98245">32,562</text>
      <text x="14" y="39" font-family="'DM Mono', monospace" font-size="8.5" fill="#87786E" letter-spacing="0.5">ASSAY RECORDS</text>

      <rect x="145" y="0" width="115" height="48" rx="8" fill="#211D19" stroke="#493A30"/>
      <text x="159" y="24" font-family="'Syne', sans-serif" font-size="18" font-weight="700" fill="#E8D6C1">18 Sites</text>
      <text x="159" y="39" font-family="'DM Mono', monospace" font-size="8.5" fill="#87786E" letter-spacing="0.5">GEOLOGICAL BLOCKS</text>

      <rect x="270" y="0" width="125" height="48" rx="8" fill="#211D19" stroke="#493A30"/>
      <text x="284" y="24" font-family="'Syne', sans-serif" font-size="18" font-weight="700" fill="#78B89A">10 Minerals</text>
      <text x="284" y="39" font-family="'DM Mono', monospace" font-size="8.5" fill="#87786E" letter-spacing="0.5">COMMODITIES</text>

      <rect x="405" y="0" width="135" height="48" rx="8" fill="#211D19" stroke="#493A30"/>
      <text x="419" y="24" font-family="'Syne', sans-serif" font-size="18" font-weight="700" fill="#FF9557">CUDA Accel.</text>
      <text x="419" y="39" font-family="'DM Mono', monospace" font-size="8.5" fill="#87786E" letter-spacing="0.5">NVIDIA RTX 3050</text>
    </g>
  </g>
</svg>
